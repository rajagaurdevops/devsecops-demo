name: "DevSecOps Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least-privilege token by default. security-events:write is needed to upload
# SARIF to the Security tab; id-token:write is needed for AWS OIDC auth below.
permissions:
  contents: read
  security-events: write
  # id-token: write

# Cancel superseded runs on the same branch/PR instead of letting them race
# against Terraform state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security_scan:
    name: "Security Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. SAST for App Code (Python Bandit)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Bandit
        run: pip install bandit bandit-sarif-formatter

      - name: Run Bandit (Python Security Scanner)
        run: bandit -r ./app/ -f sarif -o bandit-results.sarif
        # No `|| echo` / continue-on-error here on purpose: a real finding
        # should fail this job and block the terraform job below.

      - name: Upload Bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      # 2. Secret Scanning (Gitleaks) -- blocking, no continue-on-error.
      # A leaked credential should always stop the pipeline.
      - name: Gitleaks Secret Scanner
        if: always()
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

      # 3. IaC Security Scanning: tfsec was merged into Trivy in 2023 and is no
      # longer actively developed, so this is now covered by Trivy's
      # misconfiguration scanner in the step below instead of a separate action.

      # 4. Vulnerability, Dependency & IaC Config Scanning (Trivy)
      - name: Run Trivy Scanner
        if: always()
        uses: aquasecurity/trivy-action@master # Always pulls the latest stable version
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig' # misconfig covers the ./terraform IaC checks
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1' # fail the job on CRITICAL/HIGH findings
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  terraform:
    name: "Infrastructure Deployment"
    needs: security_scan # now a real gate -- this job only runs if scans pass
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 2
